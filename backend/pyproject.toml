[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "light-therapy-dss-backend"
version = "1.1.0"
description = "Research demonstrator backend for an IoT-enabled light-therapy decision-support system"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.139.0",
  "starlette==1.3.1",
  "uvicorn[standard]==0.51.0",
  "SQLAlchemy==2.0.51",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
]

[project.optional-dependencies]
test = [
  "httpx==0.28.1",
  "httpx2==2.5.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pip-audit==2.10.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"

[tool.setuptools.packages.find]
include = ["app*"]
